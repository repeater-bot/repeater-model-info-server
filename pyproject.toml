[project]
name = "repeater_model_info_server"
version = "1.1.1.0"
description = "Used to provide model information to the Repeater."
authors = [
    {name = "Qeggs",email = "get_boot@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiofiles (>=25.1.0,<26.0.0)",
    "environs (<=15.0.0)",
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "orjson (>=3.13.0,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
